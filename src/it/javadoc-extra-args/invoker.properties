# doclint is all,-missing with failOnWarnings, so an unregistered tag fails
# attach-javadocs and the project can never be released. javadoc.extra.args must
# reach <additionalOptions> so a child can register one without overriding the
# whole javadoc configuration and losing doclint and failOnWarnings with it.
invoker.goals = javadoc:jar
invoker.buildResult = success
