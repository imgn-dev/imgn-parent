# A multi-module project refers to itself with -SNAPSHOT between releases.
# banDynamicVersions must not treat that as a dynamic version, or no such project
# can build at all. Ranges, LATEST and RELEASE stay banned; shipping a release
# that depends on a snapshot is caught by requireReleaseDeps under -PperformRelease,
# which is the only moment it matters.
invoker.goals = verify
invoker.buildResult = success
