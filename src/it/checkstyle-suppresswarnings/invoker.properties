# @SuppressWarnings("checkstyle:X") must actually suppress X. SuppressWarningsHolder
# collects the annotation while walking the tree, but only the Checker-level
# SuppressWarningsFilter consumes what it collected. Declaring the holder alone
# leaves every such annotation silently inert, which is what shipped in 2026-08-01.
invoker.goals = verify
invoker.buildResult = success
