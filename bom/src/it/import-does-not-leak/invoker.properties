# A project that imports the BOM and nothing else asks for JUnit without a
# version. The BOM does not manage JUnit, so the build must fail with
# "'dependencies.dependency.version' ... is missing". A success means the BOM
# is leaking dependency management it inherited, which every importer receives.
# import-only is the control that rules out any other cause of failure.
invoker.goals = validate
invoker.buildResult = failure
