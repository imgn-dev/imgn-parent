name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is what everything compiles to; the newest JDK is built too, because
        # Error Prone reflects into javac internals and breaks on new releases.
        java: ['25', '26']
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # verify runs the invoker integration tests under src/it, which are the
      # only thing proving the quality gates still enforce. install rather than
      # verify because the BOM below is a separate build that resolves this POM
      # from the local repository.
      - name: Build and verify the parent
        run: ./mvnw -B --no-transfer-progress clean install

      # bom/ is deliberately not a <module> of the parent: modules are inherited,
      # so every external child would try to build a bom/ of its own. It is a
      # second invocation instead, and it must come after the parent is installed.
      - name: Build and verify the BOM
        run: ./mvnw -B --no-transfer-progress -f bom/pom.xml clean install

      - name: Upload integration test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: it-logs-jdk${{ matrix.java }}
          path: |
            target/it/*/build.log
            bom/target/it/*/build.log
          if-no-files-found: ignore
