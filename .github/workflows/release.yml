name: Release

# Manual only. Publishing is deliberately not automatic on push to main.
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release: YYYY-MM or YYYY-MM-DD, e.g. 2026-08'
        required: true
        type: string
      nextVersion:
        description: 'Next development version: YYYY-MM or YYYY-MM-DD, e.g. 2026-09 (-SNAPSHOT is added for you)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # First, before anything is checked out or published: a malformed version
      # would be written into imgn.config.version too, and every child resolves
      # that. A month of 00 or a day of 32 is a typo, not a version.
      - name: Check version format
        run: |
          pattern='^[0-9]{4}-(0[1-9]|1[0-2])(-(0[1-9]|[12][0-9]|3[01]))?$'
          for input in 'releaseVersion:${{ inputs.releaseVersion }}' 'nextVersion:${{ inputs.nextVersion }}'; do
            name=${input%%:*}
            value=${input#*:}
            if [[ ! $value =~ $pattern ]]; then
              echo "::error::$name is '$value'. It must be YYYY-MM or YYYY-MM-DD, and nothing else."
              exit 1
            fi
          done
          if [[ '${{ inputs.nextVersion }}' < '${{ inputs.releaseVersion }}' || '${{ inputs.nextVersion }}' == '${{ inputs.releaseVersion }}' ]]; then
            echo "::error::nextVersion must be later than releaseVersion."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # A full history, so the tag this workflow pushes has ancestry.
          fetch-depth: 0

      - name: Set up JDK and publishing credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # Writes ~/.m2/settings.xml with a <server> whose id matches
          # <publishingServerId>central</publishingServerId> in the POM.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # release:prepare is deliberately not used: it rewrites <version> but not
      # imgn.config.version, and the non-inherited enforcer rule would then fail
      # the release. Both are set explicitly instead.
      # ORDER MATTERS, and getting it wrong fails only on a clean machine.
      #
      # The BOM restates its own version AND its parent's, because Central's
      # validator reads each deployed .pom standalone and never resolves the
      # parent. So four strings move, and every `-f bom/pom.xml` invocation has
      # to build the BOM's model first, which means resolving its parent.
      #
      # Bump the BOM FIRST, while bom/pom.xml still names the version that
      # pom.xml on disk still has, so relativePath resolves it. Touch the parent
      # first and the two disagree: Maven reports "parent.relativePath points at
      # wrong local POM", falls back to the repository, and looks for a SNAPSHOT
      # that was never published. A developer machine has it cached and succeeds;
      # a fresh runner does not and the release dies here.
      - name: Set release version
        run: |
          ./mvnw -B --no-transfer-progress -f bom/pom.xml versions:set \
            -DnewVersion='${{ inputs.releaseVersion }}' -DgenerateBackupPoms=false
          # skipResolution: the version being pointed at is the one this run is
          # about to publish, so it cannot be resolved yet.
          ./mvnw -B --no-transfer-progress -f bom/pom.xml versions:update-parent \
            -DparentVersion='${{ inputs.releaseVersion }}' \
            -DskipResolution=true -DgenerateBackupPoms=false
          ./mvnw -B --no-transfer-progress versions:set \
            -DnewVersion='${{ inputs.releaseVersion }}' -DgenerateBackupPoms=false
          ./mvnw -B --no-transfer-progress versions:set-property \
            -Dproperty=imgn.config.version \
            -DnewVersion='${{ inputs.releaseVersion }}' -DgenerateBackupPoms=false

      # install, not verify: the BOM is a separate build that resolves the parent
      # from the local repository.
      - name: Verify
        run: |
          ./mvnw -B --no-transfer-progress clean install
          ./mvnw -B --no-transfer-progress -f bom/pom.xml clean install

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # -Prelease attaches sources and javadoc, signs with GPG, and hands the
        # bundle to central-publishing-maven-plugin. autoPublish is false, so the
        # deployment waits in the Central portal for a human to release it.
        #
        # invoker.skip: the Verify step above already ran every integration test.
        # Running them again here would fork child builds while the release
        # profile is active, and those children then try to GPG-sign artifacts of
        # their own, which fails. Nothing is lost — this step publishes, it does
        # not test.
        #
        # Two deployments, parent then BOM. They are separate builds because the
        # parent cannot aggregate the BOM: <modules> is inherited, so every
        # external child would try to build a bom/ of its own.
        run: |
          ./mvnw -B --no-transfer-progress -Prelease -DskipTests -Dinvoker.skip=true deploy
          ./mvnw -B --no-transfer-progress -f bom/pom.xml -Prelease -DskipTests -Dinvoker.skip=true deploy

      - name: Tag the release
        # The POM may already sit at the version being released, in which case
        # versions:set changed nothing and there is nothing to commit. That must
        # not fail the run: publishing has already happened by this point.
        run: |
          if git diff --quiet; then
            echo 'Already at ${{ inputs.releaseVersion }}, nothing to commit.'
          else
            git commit -am 'Release ${{ inputs.releaseVersion }}'
          fi
          git tag -a 'v${{ inputs.releaseVersion }}' -m 'Release ${{ inputs.releaseVersion }}'

      - name: Start the next development version
        run: |
          # BOM first, for the same reason as the release bump above.
          next='${{ inputs.nextVersion }}-SNAPSHOT'
          ./mvnw -B --no-transfer-progress -f bom/pom.xml versions:set \
            -DnewVersion="$next" -DgenerateBackupPoms=false
          ./mvnw -B --no-transfer-progress -f bom/pom.xml versions:update-parent \
            -DparentVersion="$next" -DskipResolution=true -DgenerateBackupPoms=false
          ./mvnw -B --no-transfer-progress versions:set \
            -DnewVersion="$next" -DgenerateBackupPoms=false
          ./mvnw -B --no-transfer-progress versions:set-property \
            -Dproperty=imgn.config.version \
            -DnewVersion="$next" -DgenerateBackupPoms=false
          git commit -am "Start $next"
          git push origin HEAD --follow-tags

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create 'v${{ inputs.releaseVersion }}' \
            --title 'v${{ inputs.releaseVersion }}' --generate-notes
